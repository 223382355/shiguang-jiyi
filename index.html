<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>时光记忆 · 家庭多媒体日记</title>
<style>
/* ============================================
   时光记忆 · 适老化样式
   原则：大字号、大按钮、高对比度、温暖配色
   ============================================ */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
    font-size: 22px;
    line-height: 1.6;
    color: #2c2c2c;
    background: linear-gradient(180deg, #fff8f0 0%, #fef3e2 100%);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

/* 禁用页面缩放时的双击放大 */
button, input {
    font-size: inherit;
    touch-action: manipulation;
}

button:active {
    transform: scale(0.97);
}

.hidden-input {
    display: none !important;
}

/* ============== 顶部标题 ============== */
.header {
    text-align: center;
    padding: 24px 16px 8px;
    background: linear-gradient(135deg, #ff9a76 0%, #ff6b6b 100%);
    color: white;
    border-radius: 0 0 30px 30px;
    box-shadow: 0 4px 20px rgba(255, 107, 107, 0.25);
}

.app-title {
    margin: 0;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 2px;
}

.app-subtitle {
    margin: 6px 0 12px;
    font-size: 20px;
    opacity: 0.95;
}

/* ============== 步骤指示条 ============== */
.step-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 12px;
    gap: 4px;
}

.step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 16px;
    color: #aaa;
    font-weight: 600;
    min-width: 56px;
}

.step-num {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #e0e0e0;
    color: white;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
}

.step.active {
    color: #ff6b6b;
}

.step.active .step-num {
    background: #ff6b6b;
    box-shadow: 0 2px 10px rgba(255, 107, 107, 0.4);
}

.step.done {
    color: #4caf50;
}

.step.done .step-num {
    background: #4caf50;
}

.step-line {
    width: 30px;
    height: 3px;
    background: #e0e0e0;
    border-radius: 2px;
    margin-bottom: 16px;
}

.step-line.done {
    background: #4caf50;
}

/* ============== 容器 ============== */
.container {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 16px 40px;
}

/* ============== 面板 ============== */
.step-panel {
    display: none;
    animation: fadeIn 0.4s ease;
}

.step-panel.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.panel-title {
    text-align: center;
    margin-bottom: 24px;
}

.step-icon {
    font-size: 50px;
    display: block;
    margin-bottom: 8px;
}

.panel-title h2 {
    margin: 0 0 8px;
    font-size: 30px;
    color: #2c2c2c;
    font-weight: 700;
}

.hint {
    margin: 0;
    color: #777;
    font-size: 20px;
}

.hint.small {
    font-size: 17px;
    color: #999;
}

/* ============== 大按钮（通用） ============== */
.big-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    min-height: 90px;
    border: none;
    border-radius: 24px;
    background: linear-gradient(135deg, #ff9a76 0%, #ff6b6b 100%);
    color: white;
    font-size: 28px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 107, 107, 0.35);
    transition: all 0.2s;
    padding: 16px 24px;
}

.big-btn:active {
    transform: scale(0.97);
    box-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
}

.big-btn:disabled {
    background: #ccc;
    box-shadow: none;
    cursor: not-allowed;
}

.btn-emoji {
    font-size: 36px;
}

/* ============== 相机按钮 ============== */
.camera-area {
    margin-bottom: 24px;
}

.camera-btn {
    background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
    box-shadow: 0 6px 20px rgba(86, 171, 47, 0.35);
}

.preview-box {
    margin-top: 20px;
    text-align: center;
}

.preview-box img {
    max-width: 100%;
    max-height: 400px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
}

/* ============== 录音按钮 ============== */
.record-area {
    text-align: center;
    padding: 30px 0;
}

.record-btn {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(255, 75, 43, 0.45);
    transition: all 0.15s;
}

.record-btn:active,
.record-btn.recording {
    transform: scale(0.92);
    background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
    box-shadow: 0 4px 15px rgba(255, 75, 43, 0.35);
}

.record-icon {
    font-size: 56px;
    margin-bottom: 4px;
}

.record-btn.recording .record-icon {
    animation: pulse 0.8s infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

.record-text {
    font-size: 22px;
    font-weight: 700;
}

.record-hint {
    margin-top: 16px;
    color: #777;
    font-size: 18px;
}

.transcript-box {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin: 20px 0;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}

.transcript-label {
    margin: 0 0 8px;
    font-size: 18px;
    color: #888;
}

.transcript-text {
    margin: 0 0 12px;
    font-size: 24px;
    color: #2c2c2c;
    font-weight: 500;
}

/* ============== 导航按钮 ============== */
.nav-btn {
    display: block;
    width: 100%;
    min-height: 70px;
    border: none;
    border-radius: 18px;
    background: #ff6b6b;
    color: white;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
    margin-top: 12px;
}

.nav-btn:disabled {
    background: #ccc;
    box-shadow: none;
    cursor: not-allowed;
}

.nav-btn.nav-prev {
    background: #95a5a6;
    box-shadow: 0 4px 15px rgba(149, 165, 166, 0.3);
}

.nav-row {
    display: flex;
    gap: 12px;
}

.nav-row .nav-btn {
    flex: 1;
}

.small-btn {
    background: #ecf0f1;
    border: none;
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 18px;
    color: #555;
    cursor: pointer;
}

/* ============== 风格选择 ============== */
.style-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
}

.style-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 130px;
    border: 3px solid transparent;
    border-radius: 24px;
    background: white;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    transition: all 0.2s;
}

.style-btn:active {
    transform: scale(0.97);
}

.style-btn.selected {
    border-color: #ff6b6b;
    background: #fff5f5;
    box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
}

.style-emoji {
    font-size: 50px;
    margin-bottom: 8px;
}

.style-name {
    font-size: 26px;
    font-weight: 700;
    color: #2c2c2c;
}

/* ============== 加载动画 ============== */
.loading-icon {
    animation: spin 1.5s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.loader {
    width: 80%;
    height: 14px;
    background: #eee;
    border-radius: 10px;
    margin: 30px auto;
    overflow: hidden;
}

.loader-bar {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, #ff9a76, #ff6b6b);
    border-radius: 10px;
    animation: loadSlide 1.5s ease-in-out infinite;
}

@keyframes loadSlide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
}

/* ============== 视频预览 ============== */
.video-box {
    position: relative;
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 6px 30px rgba(0, 0, 0, 0.2);
    background: #222;
    margin-bottom: 20px;
}

.video-box canvas {
    width: 100%;
    height: auto;
    display: block;
}

.play-btn {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.9);
    border: none;
    padding: 14px 32px;
    border-radius: 30px;
    font-size: 22px;
    font-weight: 700;
    color: #ff6b6b;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.video-info {
    text-align: center;
    margin-bottom: 20px;
    padding: 0 10px;
}

.video-info h3 {
    margin: 0 0 4px;
    font-size: 26px;
    color: #2c2c2c;
}

.video-info p {
    margin: 0;
    font-size: 18px;
    color: #888;
}

.action-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
}

.action-btn {
    min-height: 80px;
}

.share-note {
    background: #fff9e6;
    border-radius: 16px;
    padding: 16px;
    font-size: 18px;
    color: #8a6d3b;
    text-align: center;
    border: 2px dashed #f1c40f;
}

/* ============== Toast ============== */
.toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.85);
    color: white;
    padding: 16px 28px;
    border-radius: 14px;
    font-size: 20px;
    z-index: 9999;
    display: none;
    max-width: 80%;
    text-align: center;
}

.toast.show {
    display: block;
    animation: toastShow 0.3s ease;
}

@keyframes toastShow {
    from { opacity: 0; transform: translate(-50%, -40%); }
    to { opacity: 1; transform: translate(-50%, -50%); }
}

/* ============== 响应式 ============== */
@media (max-width: 380px) {
    html, body { font-size: 20px; }
    .app-title { font-size: 32px; }
    .style-btn { min-height: 110px; }
}

</style>
</head>
<body>

<!-- 顶部标题栏 -->
<header class="header">
    <h1 class="app-title">🌅 时光记忆</h1>
    <p class="app-subtitle">随手一拍，AI帮你做电影</p>
</header>

<!-- 步骤指示器 -->
<div class="step-bar">
    <div class="step active" data-step="1"><span class="step-num">1</span>一拍</div>
    <div class="step-line"></div>
    <div class="step" data-step="2"><span class="step-num">2</span>一说</div>
    <div class="step-line"></div>
    <div class="step" data-step="3"><span class="step-num">3</span>一选</div>
    <div class="step-line"></div>
    <div class="step" data-step="4"><span class="step-num">4</span>完成</div>
</div>

<!-- 主内容区 -->
<main class="container">

    <!-- ============ 步骤1：拍照 ============ -->
    <section id="step1" class="step-panel active">
        <div class="panel-title">
            <span class="step-icon">📷</span>
            <h2>第一步 · 拍一张照片</h2>
            <p class="hint">点击下面的按钮，打开相机拍照</p>
        </div>

        <div class="camera-area">
            <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden-input">
            <button class="big-btn camera-btn" id="cameraBtn">
                <span class="btn-emoji">📸</span>
                <span class="btn-text">打开相机拍照</span>
            </button>
            <div class="preview-box" id="imagePreview" style="display:none;">
                <img id="previewImg" alt="照片预览">
                <button class="small-btn" id="retakeBtn">🔄 重新拍一张</button>
            </div>
        </div>

        <button class="nav-btn" id="toStep2" disabled="">下一步 →</button>
    </section>

    <!-- ============ 步骤2：录音 ============ -->
    <section id="step2" class="step-panel">
        <div class="panel-title">
            <span class="step-icon">🎙️</span>
            <h2>第二步 · 说几句话</h2>
            <p class="hint">按住按钮，告诉系统今天发生了什么</p>
            <p class="hint small">（可以说方言或大白话哦）</p>
        </div>

        <div class="record-area">
            <button class="record-btn" id="recordBtn">
                <span class="record-icon">🎤</span>
                <span class="record-text">按住说话</span>
            </button>
            <p class="record-hint" id="recordHint">按住上面的红色按钮开始说话…</p>
        </div>

        <!-- 语音转文字预览 -->
        <div class="transcript-box" id="transcriptBox" style="display:none;">
            <p class="transcript-label">🗣️ 你说的是：</p>
            <p class="transcript-text" id="transcriptText">（识别中…）</p>
            <button class="small-btn" id="rerecordBtn">🔄 重新录</button>
        </div>

        <div class="nav-row">
            <button class="nav-btn nav-prev" id="backToStep1">← 上一步</button>
            <button class="nav-btn" id="toStep3" disabled="">下一步 →</button>
        </div>
    </section>

    <!-- ============ 步骤3：选风格 ============ -->
    <section id="step3" class="step-panel">
        <div class="panel-title">
            <span class="step-icon">🎨</span>
            <h2>第三步 · 选一个风格</h2>
            <p class="hint">点一种你喜欢的风格，AI就开始帮你做视频啦！</p>
        </div>

        <div class="style-grid">
            <button class="style-btn" data-style="文艺">
                <span class="style-emoji">🌸</span>
                <span class="style-name">文艺</span>
            </button>
            <button class="style-btn" data-style="喜庆">
                <span class="style-emoji">🎉</span>
                <span class="style-name">喜庆</span>
            </button>
            <button class="style-btn" data-style="美丽">
                <span class="style-emoji">🌄</span>
                <span class="style-name">美丽</span>
            </button>
            <button class="style-btn" data-style="怀旧">
                <span class="style-emoji">📜</span>
                <span class="style-name">怀旧</span>
            </button>
        </div>

        <div class="nav-row">
            <button class="nav-btn nav-prev" id="backToStep2">← 上一步</button>
        </div>
    </section>

    <!-- ============ 步骤3.5：生成中 ============ -->
    <section id="stepGenerating" class="step-panel">
        <div class="panel-title">
            <span class="step-icon loading-icon">⏳</span>
            <h2>AI正在帮你做视频…</h2>
            <p class="hint" id="generateHint">正在识别照片内容</p>
        </div>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
    </section>

    <!-- ============ 步骤4：视频预览 ============ -->
    <section id="step4" class="step-panel">
        <div class="panel-title">
            <span class="step-icon">🎬</span>
            <h2>做好啦！</h2>
            <p class="hint">看看你的家庭记忆视频吧 🎉</p>
        </div>

        <!-- Canvas 视频合成预览 -->
        <div class="video-box">
            <canvas id="videoCanvas" width="720" height="1280"></canvas>
            <button class="play-btn" id="playBtn">▶️ 播放视频</button>
        </div>

        <div class="video-info">
            <h3 id="videoTitle">标题</h3>
            <p id="videoSubtitle">副标题</p>
        </div>

        <div class="action-grid">
            <button class="big-btn action-btn" id="downloadBtn">
                <span class="btn-emoji">💾</span>
                <span class="btn-text">保存到手机</span>
            </button>
            <button class="big-btn action-btn" id="shareBtn">
                <span class="btn-emoji">📤</span>
                <span class="btn-text">分享给家人</span>
            </button>
            <button class="big-btn action-btn" id="restartBtn">
                <span class="btn-emoji">🔄</span>
                <span class="btn-text">重新做一个</span>
            </button>
        </div>

        <!-- 子女互动二维码（简化版：用文字展示） -->
        <div class="share-note">
            <p>💡 <strong>小贴士：</strong>分享给子女后，他们可以在视频下方留言语音哦！</p>
        </div>
    </section>

</main>

<!-- 隐藏的 audio 用于播放录音 -->
<audio id="recordingPlayer" style="display:none;"></audio>

<!-- 隐藏的 video 用于 MediaRecorder 输出 -->
<video id="hiddenVideo" style="display:none;"></video>

<!-- 状态 toast -->
<div id="toast" class="toast"></div>

<script>
// ============================================
// 全局状态
// ============================================
const AppState = {
    step: 1,
    imageBase64: null,        // 用户拍照的 base64
    speechBlob: null,         // 录音 Blob
    speechText: "",           // 语音转文字结果
    imageDesc: "",            // AI 识别图片描述
    selectedStyle: null,      // 用户选择的风格
    aiContent: null,          // AI 生成的文案/字幕
    audioChunks: [],          // 录音分片
    mediaRecorder: null,      // MediaRecorder 实例
};

// ============================================
// Toast 提示
// ============================================
function toast(msg, duration = 2500) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => t.classList.remove("show"), duration);
}

// ============================================
// 步骤切换
// ============================================
function goStep(n) {
    AppState.step = n;
    // 隐藏所有面板
    document.querySelectorAll(".step-panel").forEach(p => p.classList.remove("active"));

    let panelId = null;
    if (n === 1) panelId = "step1";
    else if (n === 2) panelId = "step2";
    else if (n === 3) panelId = "step3";
    else if (n === 3.5) panelId = "stepGenerating";
    else if (n === 4) panelId = "step4";

    if (panelId) document.getElementById(panelId).classList.add("active");

    // 更新顶部步骤条
    document.querySelectorAll(".step").forEach(el => {
        const stepNum = parseInt(el.dataset.step);
        el.classList.remove("active", "done");
        if (n === 4) {
            // 全部 done
            if (stepNum <= 4) el.classList.add("done");
            if (stepNum === 4) el.classList.add("active");
        } else {
            if (stepNum < Math.ceil(n)) el.classList.add("done");
            if (stepNum === Math.ceil(n)) el.classList.add("active");
        }
    });

    // 步骤线
    document.querySelectorAll(".step-line").forEach((line, i) => {
        line.classList.remove("done");
        if (n >= 4) line.classList.add("done");
        else if (i + 1 < n) line.classList.add("done");
    });
}

// ============================================
// 初始化所有事件绑定
// ============================================
document.addEventListener("DOMContentLoaded", () => {
    initCamera();
    initRecorder();
    initStyleSelect();
    initNavigation();
    initVideo();
});

function initNavigation() {
    document.getElementById("toStep2").addEventListener("click", () => goStep(2));
    document.getElementById("toStep3").addEventListener("click", () => goStep(3));
    document.getElementById("backToStep1").addEventListener("click", () => goStep(1));
    document.getElementById("backToStep2").addEventListener("click", () => goStep(2));

    document.getElementById("restartBtn").addEventListener("click", () => {
        // 重置状态
        AppState.imageBase64 = null;
        AppState.speechBlob = null;
        AppState.speechText = "";
        AppState.imageDesc = "";
        AppState.selectedStyle = null;
        AppState.aiContent = null;

        // 重置 UI
        document.getElementById("imagePreview").style.display = "none";
        document.getElementById("cameraBtn").style.display = "flex";
        document.getElementById("toStep2").disabled = true;
        document.getElementById("transcriptBox").style.display = "none";
        document.getElementById("toStep3").disabled = true;
        document.querySelectorAll(".style-btn").forEach(b => b.classList.remove("selected"));

        stopVideoPlayback();
        goStep(1);
    });
}

</script>
<script>
// ============================================
// 拍照模块
// ============================================
function initCamera() {
    const cameraBtn = document.getElementById("cameraBtn");
    const cameraInput = document.getElementById("cameraInput");
    const retakeBtn = document.getElementById("retakeBtn");
    const previewImg = document.getElementById("previewImg");
    const previewBox = document.getElementById("imagePreview");
    const toStep2Btn = document.getElementById("toStep2");

    // 点击按钮触发文件选择（会调起手机相机）
    cameraBtn.addEventListener("click", () => {
        cameraInput.click();
    });

    retakeBtn.addEventListener("click", () => {
        cameraInput.value = "";  // 清空，允许重选同一张
        previewBox.style.display = "none";
        cameraBtn.style.display = "flex";
        AppState.imageBase64 = null;
        toStep2Btn.disabled = true;
    });

    cameraInput.addEventListener("change", async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        // 读取为 base64
        try {
            const base64 = await fileToBase64(file);
            AppState.imageBase64 = base64;

            // 显示预览
            previewImg.src = "data:image/jpeg;base64," + base64;
            previewBox.style.display = "block";
            cameraBtn.style.display = "none";
            toStep2Btn.disabled = false;

            toast("照片拍好啦！");
        } catch (err) {
            console.error("读取图片失败：", err);
            toast("照片读取失败，请重拍");
        }
    });
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            // reader.result 是 "data:image/jpeg;base64,xxx"
            const full = reader.result;
            const commaIdx = full.indexOf(",");
            resolve(commaIdx >= 0 ? full.substring(commaIdx + 1) : full);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function initRecorder() {

    let isRecording = false;
    let stream = null;
    let audioCtx = null;
    let silenceTimer = null;

    // 长按录音（touchstart/touchend 兼容移动端；mousedown/mouseup 兼容桌面）
    const startRecord = async () => {
        if (isRecording) return;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
            console.error("麦克风权限错误：", err);
            toast("请允许使用麦克风哦~");
            return;
        }

        isRecording = true;
        AppState.audioChunks = [];

        // 选择支持的格式
        const mimeTypes = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg", "audio/mp4"];
        let mimeType = "";
        for (const t of mimeTypes) {
            if (MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
        }

        try {
            AppState.mediaRecorder = mimeType
                ? new MediaRecorder(stream, { mimeType })
                : new MediaRecorder(stream);
        } catch (e) {
            AppState.mediaRecorder = new MediaRecorder(stream);
        }

        AppState.mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) AppState.audioChunks.push(e.data);
        };

        AppState.mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(AppState.audioChunks, { type: mimeType || "audio/webm" });
            AppState.speechBlob = blob;
            isRecording = false;

            recordBtn.classList.remove("recording");
            recordIcon.textContent = "🎤";
            recordText.textContent = "按住说话";
            recordHint.textContent = "录音结束，正在识别你说的话…";

            transcriptBox.style.display = "block";
            transcriptText.textContent = "（识别中…）";

            try {
                const result = await API.speechToText(blob, mimeType || "audio/webm");
                AppState.speechText = result.text || "美好的一天";
                transcriptText.textContent = AppState.speechText;
                toStep3Btn.disabled = false;
                toast("识别完成 ✓");
            } catch (err) {
                console.error("ASR 失败：", err);
                AppState.speechText = "今天心情很好";
                transcriptText.textContent = AppState.speechText;
                toStep3Btn.disabled = false;
            }
        };

        AppState.mediaRecorder.start();
        recordBtn.classList.add("recording");
        recordIcon.textContent = "🔴";
        recordText.textContent = "松开结束";
        recordHint.textContent = "正在录音… 松开按钮停止";
    };

    const stopRecord = () => {
        if (!isRecording || !AppState.mediaRecorder) return;
        try {
            AppState.mediaRecorder.stop();
        } catch (e) {
            // ignore
        }
    };

    // 移动端事件
    recordBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecord(); });
    recordBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopRecord(); });
    recordBtn.addEventListener("touchcancel", (e) => { e.preventDefault(); stopRecord(); });

    // 桌面事件
    recordBtn.addEventListener("mousedown", startRecord);
    recordBtn.addEventListener("mouseup", stopRecord);
    recordBtn.addEventListener("mouseleave", () => { if (isRecording) stopRecord(); });

    // 重新录音
    rerecordBtn.addEventListener("click", () => {
        transcriptBox.style.display = "none";
        toStep3Btn.disabled = true;
        AppState.speechBlob = null;
        AppState.speechText = "";
    });
}

<script>
// ============================================
// Canvas 视频合成 + MediaRecorder 录制
// ============================================

let videoAnimId = null;
let videoStartTime = 0;
let isVideoPlaying = false;
let currentMusicGen = null;

async function initVideo() {
    const playBtn = document.getElementById("playBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const shareBtn = document.getElementById("shareBtn");

    playBtn.addEventListener("click", toggleVideoPlay);
    downloadBtn.addEventListener("click", downloadVideo);
    shareBtn.addEventListener("click", async () => {
        if (!window.navigator.share) {
            toast("请先点「保存到手机」，再到相册分享给家人～");
            return;
        }
        toast("请先点「保存到手机」，再从相册分享给家人吧～");
    });

    // 隐藏录音音频元素，用于播放用户原声
    const recPlayer = document.getElementById("recordingPlayer");
    recPlayer.volume = 0.7;
}

async function toggleVideoPlay() {
    const playBtn = document.getElementById("playBtn");
    const canvas = document.getElementById("videoCanvas");

    if (isVideoPlaying) {
        stopVideoPlayback();
        playBtn.textContent = "▶️ 播放视频";
        return;
    }

    // 启动音乐
    if (currentMusicGen) {
        currentMusicGen.stop();
    }
    const musicStyle = AppState.aiContent?.music || "classical";
    currentMusicGen = new MusicGenerator(musicStyle, 12);
    await currentMusicGen.start();

    // 如果有录音，也播放原声
    const recPlayer = document.getElementById("recordingPlayer");
    if (AppState.speechBlob) {
        recPlayer.src = URL.createObjectURL(AppState.speechBlob);
        try { await recPlayer.play(); } catch (e) {}
    }

    // 启动 Canvas 动画
    isVideoPlaying = true;
    videoStartTime = performance.now();
    animateVideo();
    playBtn.textContent = "⏸️ 暂停";
}

function stopVideoPlayback() {
    isVideoPlaying = false;
    if (videoAnimId) cancelAnimationFrame(videoAnimId);
    videoAnimId = null;
    if (currentMusicGen) {
        currentMusicGen.stop();
        currentMusicGen = null;
    }
    const recPlayer = document.getElementById("recordingPlayer");
    try { recPlayer.pause(); } catch (e) {}
    document.getElementById("playBtn").textContent = "▶️ 播放视频";
}

function animateVideo() {
    if (!isVideoPlaying) return;
    const canvas = document.getElementById("videoCanvas");
    const ctx = canvas.getContext("2d");
    const elapsed = (performance.now() - videoStartTime) / 1000;
    const totalDuration = 12;

    renderFrame(ctx, canvas, elapsed, totalDuration);

    if (elapsed < totalDuration + 0.5) {
        videoAnimId = requestAnimationFrame(animateVideo);
    } else {
        // 视频结束，自动回放
        stopVideoPlayback();
        setTimeout(() => {
            // 回到初始状态
            drawFirstFrame();
        }, 300);
    }
}

function drawFirstFrame() {
    const canvas = document.getElementById("videoCanvas");
    const ctx = canvas.getContext("2d");
    renderFrame(ctx, canvas, 0, 12);
}

// 渲染单帧：背景渐变色 + Ken Burns 图片 + 大字字幕
function renderFrame(ctx, canvas, elapsed, totalDuration) {
    const W = canvas.width;
    const H = canvas.height;
    const style = AppState.selectedStyle || "文艺";

    // === 1. 渐变背景 ===
    const bgColors = {
        "文艺": ["#fce4ec", "#f8bbd9"],
        "喜庆": ["#ffe0b2", "#ff7043"],
        "美丽": ["#e1f5fe", "#4fc3f7"],
        "怀旧": ["#efebe9", "#a1887f"]
    };
    const colors = bgColors[style] || bgColors["文艺"];
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(1, colors[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // === 2. Ken Burns 效果（图片慢慢放大+平移） ===
    const img = AppState._videoImage || null;
    if (img) {
        const imgAspect = img.width / img.height;
        const canvasAspect = W / H;

        // Ken Burns: 从 scale=1.0 到 scale=1.15
        const progress = elapsed / totalDuration;
        const scale = 1.0 + 0.15 * progress;

        // 轻微平移
        const tx = Math.sin(progress * Math.PI * 2) * 20;
        const ty = Math.cos(progress * Math.PI * 2) * 15;

        // 计算绘制尺寸（cover 模式）
        let drawW, drawH, offsetX, offsetY;
        if (imgAspect > canvasAspect) {
            drawH = H * scale;
            drawW = drawH * imgAspect;
            offsetX = (W - drawW) / 2 + tx;
            offsetY = (H - drawH) / 2 + ty;
        } else {
            drawW = W * scale;
            drawH = drawW / imgAspect;
            offsetX = (W - drawW) / 2 + tx;
            offsetY = (H - drawH) / 2 + ty;
        }

        // 绘制图片
        ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

        // 加半透明遮罩，让字幕更清晰
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.fillRect(0, 0, W, H);
    } else {
        // 没图片时画装饰
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.arc(W * (0.15 + i * 0.2), H * 0.4, 40 + i * 20, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // === 3. 标题 ===
    const content = AppState.aiContent || {};
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // 副标题（顶部）
    if (content.subtitle) {
        ctx.font = "bold 32px 'Microsoft YaHei', sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 2;
        ctx.fillText(content.subtitle, W / 2, 100);
    }

    // 主标题
    if (content.title) {
        ctx.font = "bold 52px 'Microsoft YaHei', sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.9)";
        ctx.shadowBlur = 12;
        ctx.fillText(content.title, W / 2, 160);
    }

    // === 4. 字幕短句（分阶段显示） ===
    const captions = content.captions || [];
    if (captions.length > 0) {
        const captionDuration = totalDuration / captions.length;
        const captionIdx = Math.min(Math.floor(elapsed / captionDuration), captions.length - 1);
        const caption = captions[captionIdx];

        // 底部字幕框（半透明黑底）
        ctx.shadowBlur = 0;
        const boxW = W - 80;
        const boxH = 120;
        const boxX = 40;
        const boxY = H - boxH - 80;
        roundRect(ctx, boxX, boxY, boxW, boxH, 20);
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 46px 'Microsoft YaHei', sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 6;
        wrapText(ctx, caption, W / 2, boxY + boxH / 2, boxW - 20, 58);
    }

    // === 5. 风格角标 ===
    ctx.shadowBlur = 0;
    ctx.font = "24px 'Microsoft YaHei', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.textAlign = "left";
    ctx.fillText("🌅 时光记忆", 30, H - 30);

    // === 6. 进度条 ===
    const barW = W - 80;
    const barX = 40;
    const barY = 40;
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(barX, barY, barW, 6);
    ctx.fillStyle = "white";
    ctx.fillRect(barX, barY, barW * Math.min(elapsed / totalDuration, 1), 6);
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function wrapText(ctx, text, centerX, centerY, maxWidth, lineHeight) {
    // 简单的单显示：如果文字不长就直接画
    if (ctx.measureText(text).width <= maxWidth) {
        ctx.fillText(text, centerX, centerY);
        return;
    }
    // 否则换行显示
    let line = "";
    const lines = [];
    for (let i = 0; i < text.length; i++) {
        const testLine = line + text[i];
        if (ctx.measureText(testLine).width > maxWidth && line.length > 0) {
            lines.push(line);
            line = text[i];
        } else {
            line = testLine;
        }
    }
    if (line) lines.push(line);

    const startY = centerY - (lines.length - 1) * lineHeight / 2;
    lines.forEach((l, i) => {
        ctx.fillText(l, centerX, startY + i * lineHeight);
    });
}

// 预加载用户照片
async function loadVideoImage() {
    if (!AppState.imageBase64) return null;
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            AppState._videoImage = img;
            resolve(img);
        };
        img.onerror = () => resolve(null);
        img.src = "data:image/jpeg;base64," + AppState.imageBase64;
    });
}

// 下载视频（用 MediaRecorder 录制 canvas）
async function downloadVideo() {
    const canvas = document.getElementById("videoCanvas");
    if (!isVideoPlaying) {
        toast("请先播放视频哦~");
        return;
    }

    toast("正在生成视频文件…");
    try {
        const stream = canvas.captureStream(30);

        // 添加录音音轨（如果有）
        if (AppState.speechBlob) {
            const audioEl = new Audio();
            audioEl.src = URL.createObjectURL(AppState.speechBlob);
            audioEl.muted = false;
            audioEl.play();
            const audioStream = audioEl.captureStream();
            audioStream.getAudioTracks().forEach(t => stream.addTrack(t));
        }

        // 选择 MediaRecorder 支持的格式
        const mimeTypes = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
        let mimeType = "video/webm";
        for (const t of mimeTypes) {
            if (MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
        }

        const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 3_000_000 });
        const chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `时光记忆_${new Date().toLocaleDateString("zh-CN").replace(/\//g, "-")}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            toast("保存成功！请到相册查看 🎉");
        };

        recorder.start();
        setTimeout(() => {
            recorder.stop();
        }, 12000);  // 录制12秒

    } catch (err) {
        console.error("录制失败：", err);
        toast("视频录制失败，但可以正常播放");
    }
}

// MIDI 音符转频率
const NOTE_FREQ = {
    "C3": 130.81, "C#3": 138.59, "D3": 146.83, "D#3": 155.56,
    "E3": 164.81, "F3": 174.61, "F#3": 185.00, "G3": 196.00,
    "G#3": 207.65, "A3": 220.00, "A#3": 233.08, "B3": 246.94,
    "C4": 261.63, "C#4": 277.18, "D4": 293.66, "D#4": 311.13,
    "E4": 329.63, "F4": 349.23, "F#4": 369.99, "G4": 392.00,
    "G#4": 415.30, "A4": 440.00, "A#4": 466.16, "B4": 493.88,
    "C5": 523.25, "C#5": 554.37, "D5": 587.33, "D#5": 622.25,
    "E5": 659.25, "F5": 698.46, "F#5": 739.99, "G5": 783.99,
    "G#5": 830.61, "A5": 880.00, "A#5": 932.33, "B5": 987.77,
    "C6": 1046.50,
    // 简写和弦名
    "Am": 220.00, "C": 261.63, "E": 329.63, "G": 392.00,
    "F": 349.23, "A": 440.00, "B": 493.88, "D": 293.66,
};

class MusicGenerator {
    constructor(style = "classical", videoDuration = 15) {
        this.style = style;
        this.duration = videoDuration;
        this.audioCtx = null;
        this.nodes = [];
    }

    async start() {
        if (this.audioCtx) return;
        try {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            console.warn("Web Audio 不可用");
            return;
        }
        if (this.audioCtx.state === "suspended") {
            await this.audioCtx.resume();
        }
        this.scheduleMusic();
    }

    stop() {
        this.nodes.forEach(n => {
            try { n.stop(); } catch (e) {}
        });
        this.nodes = [];
    }

    scheduleMusic() {
        const ctx = this.audioCtx;
        const style = STYLE_CHORDS[this.style] || STYLE_CHORDS.classical;
        const beatDur = 60 / style.bpm;
        const totalBeats = Math.ceil(this.duration / beatDur);

        // 每个和弦持续 2 拍
        for (let i = 0; i < totalBeats; i += 2) {
            const chordIdx = (i / 2) % style.chords.length;
            const chord = style.chords[chordIdx];
            const startT = ctx.currentTime + i * beatDur;
            const endT = startT + beatDur * 2;

            // 播放和弦（分解和弦风格，每个音错开一点）
            chord.forEach((note, j) => {
                const freq = NOTE_FREQ[note];
                if (!freq) return;
                const t = startT + j * 0.15;
                this.playNote(freq, t, endT - t, 0.08);
            });
        }

        // 旋律（每拍一个）
        for (let i = 0; i < totalBeats; i++) {
            const melIdx = i % style.melody.length;
            const note = style.melody[melIdx];
            const freq = NOTE_FREQ[note];
            if (!freq) continue;
            const t = ctx.currentTime + i * beatDur;
            const dur = beatDur * 0.8;
            this.playNote(freq, t, dur, 0.15);
        }
    }

    playNote(freq, startTime, duration, volume) {
        const ctx = this.audioCtx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";  // 温暖的正弦波
        osc.frequency.value = freq;

        // ADSR 包络
        const attack = 0.05;
        const decay = 0.1;
        const sustain = volume * 0.6;
        const release = 0.3;

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + attack);
        gain.gain.linearRampToValueAtTime(sustain, startTime + attack + decay);
        gain.gain.setValueAtTime(sustain, startTime + duration - release);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration + 0.1);

        this.nodes.push(osc);
    }
}

// ============================================
// 风格选择 + AI 调用 + 视频生成主流程

function initStyleSelect() {
    document.querySelectorAll(".style-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".style-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            AppState.selectedStyle = btn.dataset.style;

            // 开始 AI 处理
            generateEverything();
        });
    });
}

async function generateEverything() {
    try {
        // 进入"生成中"页面
        goStep(3.5);

        const hint = document.getElementById("generateHint");

        // Step 1: 图片识别
        hint.textContent = "📷 正在识别照片里的内容…";
        let imageDesc = "用户的生活日常";
        try {
            const r = await API.analyzeImage(AppState.imageBase64);
            imageDesc = r.description || imageDesc;
        } catch (e) {
            console.warn("图片识别失败（兜底）：", e);
        }
        AppState.imageDesc = imageDesc;

        // Step 2: 生成文案/字幕
        hint.textContent = "✍️ 正在为你润色成温暖的日记…";
        let aiContent;
        try {
            aiContent = await API.generateContent(
                imageDesc,
                AppState.speechText,
                AppState.selectedStyle
            );
        } catch (e) {
            console.warn("文案生成失败（兜底）：", e);
            aiContent = {
                ok: true,
                title: AppState.speechText?.slice(0, 10) || "美好回忆",
                subtitle: "今天的温暖记录",
                captions: ["时光缓缓流淌", "这一刻值得珍藏", "愿岁月温柔以待"],
                music: "classical"
            };
        }
        AppState.aiContent = aiContent;

        // Step 3: 预加载照片到 canvas
        hint.textContent = "🎬 正在合成视频画面…";
        await loadVideoImage();

        // Step 4: 显示标题信息
        document.getElementById("videoTitle").textContent = aiContent.title || "美好回忆";
        document.getElementById("videoSubtitle").textContent = aiContent.subtitle || "";

        // Step 5: 切换到视频页面，绘制第一帧
        goStep(4);
        drawFirstFrame();

        toast("做好啦！点击▶️播放看看~");

    } catch (err) {
        console.error("生成失败：", err);
        toast("出了点问题，试试重新来一次？");
        goStep(1);
    }
}
