function toast(msg, duration = 2500) {

function goStep(n) {
    AppState.step = n;
    // 闅愯棌鎵€鏈夐潰鏉?    document.querySelectorAll(".step-panel").forEach(p => p.classList.remove("active"));

    let panelId = null;
    if (n === 1) panelId = "step1";
    else if (n === 2) panelId = "step2";
    else if (n === 3) panelId = "step3";
    else if (n === 3.5) panelId = "stepGenerating";
    else if (n === 4) panelId = "step4";

    if (panelId) document.getElementById(panelId).classList.add("active");

    // 鏇存柊椤堕儴姝ラ鏉?    document.querySelectorAll(".step").forEach(el => {
        const stepNum = parseInt(el.dataset.step);
        el.classList.remove("active", "done");
        if (n === 4) {
            // 鍏ㄩ儴 done
            if (stepNum <= 4) el.classList.add("done");
            if (stepNum === 4) el.classList.add("active");
        } else {
            if (stepNum < Math.ceil(n)) el.classList.add("done");
            if (stepNum === Math.ceil(n)) el.classList.add("active");
        }
    });

    // 姝ラ绾?    document.querySelectorAll(".step-line").forEach((line, i) => {
        line.classList.remove("done");
        if (n >= 4) line.classList.add("done");
        else if (i + 1 < n) line.classList.add("done");
    });
}

function initCamera() {

    retakeBtn.addEventListener("click", () => {
        cameraInput.value = "";  // 娓呯┖锛屽厑璁搁噸閫夊悓涓€寮?        previewBox.style.display = "none";
        cameraBtn.style.display = "flex";
        AppState.imageBase64 = null;
        toStep2Btn.disabled = true;
    });

    cameraInput.addEventListener("change", async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        // 璇诲彇涓?base64
        try {
            const base64 = await fileToBase64(file);
            AppState.imageBase64 = base64;

            // 鏄剧ず棰勮
            previewImg.src = "data:image/jpeg;base64," + base64;
            previewBox.style.display = "block";
            cameraBtn.style.display = "none";

            toast("鐓х墖鎷嶅ソ鍟︼紒");
        } catch (err) {
            console.error("璇诲彇鍥剧墖澶辫触锛?, err);
            toast("鐓х墖璇诲彇澶辫触锛岃閲嶆媿");
        }
    });
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            // reader.result 鏄?"data:image/jpeg;base64,xxx"
            const full = reader.result;
            const commaIdx = full.indexOf(",");
            resolve(commaIdx >= 0 ? full.substring(commaIdx + 1) : full);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

<script>
// ============================================
// 褰曢煶妯″潡锛堜娇鐢?MediaRecorder锛?// ============================================
function initRecorder() {
    const recordBtn = document.getElementById("recordBtn");
    const recordIcon = recordBtn.querySelector(".record-icon");
    const recordText = recordBtn.querySelector(".record-text");
    const recordHint = document.getElementById("recordHint");
    const transcriptText = document.getElementById("transcriptText");
    const transcriptBox = document.getElementById("transcriptBox");
    const toStep3Btn = document.getElementById("toStep3");
    const rerecordBtn = document.getElementById("rerecordBtn");

    let isRecording = false;
    let stream = null;
    let audioCtx = null;
    let silenceTimer = null;

    // 闀挎寜褰曢煶锛坱ouchstart/touchend 鍏煎绉诲姩绔紱mousedown/mouseup 鍏煎妗岄潰锛?    const startRecord = async () => {
        if (isRecording) return;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
            console.error("楹﹀厠椋庢潈闄愰敊璇細", err);
            toast("璇峰厑璁镐娇鐢ㄩ害鍏嬮鍝");
            return;
        }

        isRecording = true;
        AppState.audioChunks = [];

        // 閫夋嫨鏀寔鐨勬牸寮?        const mimeTypes = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg", "audio/mp4"];
        let mimeType = "";
        for (const t of mimeTypes) {
            if (MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
        }

        try {
            AppState.mediaRecorder = mimeType
                ? new MediaRecorder(stream, { mimeType })
                : new MediaRecorder(stream);
        } catch (e) {
            AppState.mediaRecorder = new MediaRecorder(stream);
        }

        AppState.mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) AppState.audioChunks.push(e.data);
        };

        AppState.mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(AppState.audioChunks, { type: mimeType || "audio/webm" });
            AppState.speechBlob = blob;
            isRecording = false;

            recordBtn.classList.remove("recording");
            recordIcon.textContent = "馃帳";
            recordText.textContent = "鎸変綇璇磋瘽";
            recordHint.textContent = "褰曢煶缁撴潫锛屾鍦ㄨ瘑鍒綘璇寸殑璇濃€?;

            // 璋冪敤鍚庣 ASR
            transcriptBox.style.display = "block";
            transcriptText.textContent = "锛堣瘑鍒腑鈥︼級";

            try {
                const result = await API.speechToText(blob, mimeType || "audio/webm");
                AppState.speechText = result.text || "缇庡ソ鐨勪竴澶?;
                transcriptText.textContent = AppState.speechText;
                toStep3Btn.disabled = false;
                toast("璇嗗埆瀹屾垚 鉁?);
            } catch (err) {
                console.error("ASR 澶辫触锛?, err);
                AppState.speechText = "浠婂ぉ蹇冩儏寰堝ソ";
                transcriptText.textContent = AppState.speechText;
                toStep3Btn.disabled = false;
            }
        };

        AppState.mediaRecorder.start();
        recordBtn.classList.add("recording");
        recordIcon.textContent = "馃敶";
        recordText.textContent = "鏉惧紑缁撴潫";
        recordHint.textContent = "姝ｅ湪褰曢煶鈥?鏉惧紑鎸夐挳鍋滄";
    };

    const stopRecord = () => {
        if (!isRecording || !AppState.mediaRecorder) return;
        try {
            AppState.mediaRecorder.stop();
        } catch (e) {
            // ignore
        }
    };

    // 绉诲姩绔簨浠?    recordBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecord(); });
    recordBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopRecord(); });
    recordBtn.addEventListener("touchcancel", (e) => { e.preventDefault(); stopRecord(); });

    // 妗岄潰浜嬩欢
    recordBtn.addEventListener("mousedown", startRecord);
    recordBtn.addEventListener("mouseup", stopRecord);
    recordBtn.addEventListener("mouseleave", () => { if (isRecording) stopRecord(); });

    // 閲嶆柊褰曢煶
    rerecordBtn.addEventListener("click", () => {
        transcriptBox.style.display = "none";
        toStep3Btn.disabled = true;
        AppState.speechBlob = null;
        AppState.speechText = "";
    });
}

<script>
// ============================================
// Canvas 瑙嗛鍚堟垚 + MediaRecorder 褰曞埗
// ============================================

let videoAnimId = null;
let videoStartTime = 0;
let isVideoPlaying = false;
let currentMusicGen = null;

async function initVideo() {
    const playBtn = document.getElementById("playBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const shareBtn = document.getElementById("shareBtn");

    playBtn.addEventListener("click", toggleVideoPlay);
    downloadBtn.addEventListener("click", downloadVideo);
    shareBtn.addEventListener("click", async () => {
        if (!window.navigator.share) {
            toast("璇峰厛鐐广€屼繚瀛樺埌鎵嬫満銆嶏紝鍐嶅埌鐩稿唽鍒嗕韩缁欏浜猴綖");
            return;
        }
        toast("璇峰厛鐐广€屼繚瀛樺埌鎵嬫満銆嶏紝鍐嶄粠鐩稿唽鍒嗕韩缁欏浜哄惂锝?);
    });

    // 闅愯棌褰曢煶闊抽鍏冪礌锛岀敤浜庢挱鏀剧敤鎴峰師澹?    const recPlayer = document.getElementById("recordingPlayer");
    recPlayer.volume = 0.7;
}

async function toggleVideoPlay() {
    const playBtn = document.getElementById("playBtn");
    const canvas = document.getElementById("videoCanvas");

    if (isVideoPlaying) {
        stopVideoPlayback();
        playBtn.textContent = "鈻讹笍 鎾斁瑙嗛";
        return;
    }

    // 鍚姩闊充箰
    if (currentMusicGen) {
        currentMusicGen.stop();
    }
    const musicStyle = AppState.aiContent?.music || "classical";
    currentMusicGen = new MusicGenerator(musicStyle, 12);
    await currentMusicGen.start();

    // 濡傛灉鏈夊綍闊筹紝涔熸挱鏀惧師澹?    const recPlayer = document.getElementById("recordingPlayer");
    if (AppState.speechBlob) {
        recPlayer.src = URL.createObjectURL(AppState.speechBlob);
        try { await recPlayer.play(); } catch (e) {}
    }

    // 鍚姩 Canvas 鍔ㄧ敾
    isVideoPlaying = true;
    videoStartTime = performance.now();
    animateVideo();
    playBtn.textContent = "鈴革笍 鏆傚仠";
}

function stopVideoPlayback() {
    isVideoPlaying = false;
    if (videoAnimId) cancelAnimationFrame(videoAnimId);
    videoAnimId = null;
    if (currentMusicGen) {
        currentMusicGen.stop();
        currentMusicGen = null;
    }
    const recPlayer = document.getElementById("recordingPlayer");
    try { recPlayer.pause(); } catch (e) {}
    document.getElementById("playBtn").textContent = "鈻讹笍 鎾斁瑙嗛";
}

function animateVideo() {
    if (!isVideoPlaying) return;
    const canvas = document.getElementById("videoCanvas");
    const ctx = canvas.getContext("2d");
    const elapsed = (performance.now() - videoStartTime) / 1000;
    const totalDuration = 12;

    renderFrame(ctx, canvas, elapsed, totalDuration);

    if (elapsed < totalDuration + 0.5) {
        videoAnimId = requestAnimationFrame(animateVideo);
    } else {
        // 瑙嗛缁撴潫锛岃嚜鍔ㄥ洖鏀?        stopVideoPlayback();
        setTimeout(() => {
            // 鍥炲埌鍒濆鐘舵€?            drawFirstFrame();
        }, 300);
    }
}

function drawFirstFrame() {
    const canvas = document.getElementById("videoCanvas");
    const ctx = canvas.getContext("2d");
    renderFrame(ctx, canvas, 0, 12);
}

// 娓叉煋鍗曞抚锛氳儗鏅笎鍙樿壊 + Ken Burns 鍥剧墖 + 澶у瓧瀛楀箷
function renderFrame(ctx, canvas, elapsed, totalDuration) {
    const W = canvas.width;
    const H = canvas.height;
    const style = AppState.selectedStyle || "鏂囪壓";

    // === 1. 娓愬彉鑳屾櫙 ===
    const bgColors = {
        "鏂囪壓": ["#fce4ec", "#f8bbd9"],
        "鍠滃簡": ["#ffe0b2", "#ff7043"],
        "缇庝附": ["#e1f5fe", "#4fc3f7"],
        "鎬€鏃?: ["#efebe9", "#a1887f"]
    };
    const colors = bgColors[style] || bgColors["鏂囪壓"];
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(1, colors[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // === 2. Ken Burns 鏁堟灉锛堝浘鐗囨參鎱㈡斁澶?骞崇Щ锛?===
    const img = AppState._videoImage || null;
    if (img) {
        const imgAspect = img.width / img.height;
        const canvasAspect = W / H;

        // Ken Burns: 浠?scale=1.0 鍒?scale=1.15
        const progress = elapsed / totalDuration;
        const scale = 1.0 + 0.15 * progress;

        // 杞诲井骞崇Щ
        const tx = Math.sin(progress * Math.PI * 2) * 20;
        const ty = Math.cos(progress * Math.PI * 2) * 15;

        // 璁＄畻缁樺埗灏哄锛坈over 妯″紡锛?        let drawW, drawH, offsetX, offsetY;
        if (imgAspect > canvasAspect) {
            drawH = H * scale;
            drawW = drawH * imgAspect;
            offsetX = (W - drawW) / 2 + tx;
            offsetY = (H - drawH) / 2 + ty;
        } else {
            drawW = W * scale;
            drawH = drawW / imgAspect;
            offsetX = (W - drawW) / 2 + tx;
            offsetY = (H - drawH) / 2 + ty;
        }

        // 缁樺埗鍥剧墖
        ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

        // 鍔犲崐閫忔槑閬僵锛岃瀛楀箷鏇存竻鏅?        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.fillRect(0, 0, W, H);
    } else {
        // 娌″浘鐗囨椂鐢昏楗?        ctx.fillStyle = "rgba(255,255,255,0.3)";
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.arc(W * (0.15 + i * 0.2), H * 0.4, 40 + i * 20, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // === 3. 鏍囬 ===
    const content = AppState.aiContent || {};
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // 鍓爣棰橈紙椤堕儴锛?    if (content.subtitle) {
        ctx.font = "bold 32px 'Microsoft YaHei', sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 2;
        ctx.fillText(content.subtitle, W / 2, 100);
    }

    // 涓绘爣棰?    if (content.title) {
        ctx.font = "bold 52px 'Microsoft YaHei', sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.9)";
        ctx.shadowBlur = 12;
        ctx.fillText(content.title, W / 2, 160);
    }

    // === 4. 瀛楀箷鐭彞锛堝垎闃舵鏄剧ず锛?===
    const captions = content.captions || [];
    if (captions.length > 0) {
        const captionDuration = totalDuration / captions.length;
        const captionIdx = Math.min(Math.floor(elapsed / captionDuration), captions.length - 1);
        const caption = captions[captionIdx];

        // 搴曢儴瀛楀箷妗嗭紙鍗婇€忔槑榛戝簳锛?        ctx.shadowBlur = 0;
        const boxW = W - 80;
        const boxH = 120;
        const boxX = 40;
        const boxY = H - boxH - 80;
        roundRect(ctx, boxX, boxY, boxW, boxH, 20);
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 46px 'Microsoft YaHei', sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 6;
        wrapText(ctx, caption, W / 2, boxY + boxH / 2, boxW - 20, 58);
    }

    // === 5. 椋庢牸瑙掓爣 ===
    ctx.shadowBlur = 0;
    ctx.font = "24px 'Microsoft YaHei', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.textAlign = "left";
    ctx.fillText("馃寘 鏃跺厜璁板繂", 30, H - 30);

    // === 6. 杩涘害鏉?===
    const barW = W - 80;
    const barX = 40;
    const barY = 40;
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(barX, barY, barW, 6);
    ctx.fillStyle = "white";
    ctx.fillRect(barX, barY, barW * Math.min(elapsed / totalDuration, 1), 6);
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function wrapText(ctx, text, centerX, centerY, maxWidth, lineHeight) {
    // 绠€鍗曠殑鍗曟樉绀猴細濡傛灉鏂囧瓧涓嶉暱灏辩洿鎺ョ敾
    if (ctx.measureText(text).width <= maxWidth) {
        ctx.fillText(text, centerX, centerY);
        return;
    }
    // 鍚﹀垯鎹㈣鏄剧ず
    let line = "";
    const lines = [];
    for (let i = 0; i < text.length; i++) {
        const testLine = line + text[i];
        if (ctx.measureText(testLine).width > maxWidth && line.length > 0) {
            lines.push(line);
            line = text[i];
        } else {
            line = testLine;
        }
    }
    if (line) lines.push(line);

    const startY = centerY - (lines.length - 1) * lineHeight / 2;
    lines.forEach((l, i) => {
        ctx.fillText(l, centerX, startY + i * lineHeight);
    });
}

// 棰勫姞杞界敤鎴风収鐗?async function loadVideoImage() {
    if (!AppState.imageBase64) return null;

        img.src = "data:image/jpeg;base64," + AppState.imageBase64;
    });
}

// 涓嬭浇瑙嗛锛堢敤 MediaRecorder 褰曞埗 canvas锛?async function downloadVideo() {
    const canvas = document.getElementById("videoCanvas");
    if (!isVideoPlaying) {
        toast("璇峰厛鎾斁瑙嗛鍝");
        return;
    }

    toast("姝ｅ湪鐢熸垚瑙嗛鏂囦欢鈥?);
    try {
        const stream = canvas.captureStream(30);

        // 娣诲姞褰曢煶闊宠建锛堝鏋滄湁锛?        if (AppState.speechBlob) {
            const audioEl = new Audio();
            audioEl.src = URL.createObjectURL(AppState.speechBlob);
            audioEl.muted = false;
            audioEl.play();
            const audioStream = audioEl.captureStream();
            audioStream.getAudioTracks().forEach(t => stream.addTrack(t));
        }

        // 閫夋嫨 MediaRecorder 鏀寔鐨勬牸寮?        const mimeTypes = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
        let mimeType = "video/webm";
        for (const t of mimeTypes) {
            if (MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
        }

        const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 3_000_000 });
        const chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `鏃跺厜璁板繂_${new Date().toLocaleDateString("zh-CN").replace(/\//g, "-")}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            toast("淇濆瓨鎴愬姛锛佽鍒扮浉鍐屾煡鐪?馃帀");
        };

        recorder.start();
        setTimeout(() => {
            recorder.stop();
        }, 12000);  // 褰曞埗12绉?
    } catch (err) {
        console.error("褰曞埗澶辫触锛?, err);
        toast("瑙嗛褰曞埗澶辫触锛屼絾鍙互姝ｅ父鎾斁");
    }
}

// 椋庢牸瀵瑰簲鐨勭畝鍗曞拰寮﹁繘琛?const STYLE_CHORDS = {

// MIDI 闊崇杞鐜?const NOTE_FREQ = {
    "C3": 130.81, "C#3": 138.59, "D3": 146.83, "D#3": 155.56,
    "E3": 164.81, "F3": 174.61, "F#3": 185.00, "G3": 196.00,
    "G#3": 207.65, "A3": 220.00, "A#3": 233.08, "B3": 246.94,
    "C4": 261.63, "C#4": 277.18, "D4": 293.66, "D#4": 311.13,
    "E4": 329.63, "F4": 349.23, "F#4": 369.99, "G4": 392.00,
    "G#4": 415.30, "A4": 440.00, "A#4": 466.16, "B4": 493.88,
    "C5": 523.25, "C#5": 554.37, "D5": 587.33, "D#5": 622.25,
    "E5": 659.25, "F5": 698.46, "F#5": 739.99, "G5": 783.99,
    "G#5": 830.61, "A5": 880.00, "A#5": 932.33, "B5": 987.77,

    // 绠€鍐欏拰寮﹀悕
    "Am": 220.00, "C": 261.63, "E": 329.63, "G": 392.00,
    "F": 349.23, "A": 440.00, "B": 493.88, "D": 293.66,
};

class MusicGenerator {
    constructor(style = "classical", videoDuration = 15) {
        this.style = style;
        this.duration = videoDuration;
        this.audioCtx = null;
        this.nodes = [];
    }

    async start() {
        if (this.audioCtx) return;
        try {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            console.warn("Web Audio 涓嶅彲鐢?);
            return;
        }
        if (this.audioCtx.state === "suspended") {
            await this.audioCtx.resume();
        }
        this.scheduleMusic();
    }

    stop() {
        this.nodes.forEach(n => {
            try { n.stop(); } catch (e) {}
        });
        this.nodes = [];
    }

    scheduleMusic() {
        const ctx = this.audioCtx;
        const style = STYLE_CHORDS[this.style] || STYLE_CHORDS.classical;
        const beatDur = 60 / style.bpm;
        const totalBeats = Math.ceil(this.duration / beatDur);

        // 姣忎釜鍜屽鸡鎸佺画 2 鎷?        for (let i = 0; i < totalBeats; i += 2) {
            const chordIdx = (i / 2) % style.chords.length;
            const chord = style.chords[chordIdx];
            const startT = ctx.currentTime + i * beatDur;
            const endT = startT + beatDur * 2;

            // 鎾斁鍜屽鸡锛堝垎瑙ｅ拰寮﹂鏍硷紝姣忎釜闊抽敊寮€涓€鐐癸級
            chord.forEach((note, j) => {
                const freq = NOTE_FREQ[note];
                if (!freq) return;
                const t = startT + j * 0.15;
                this.playNote(freq, t, endT - t, 0.08);
            });
        }

        // 鏃嬪緥锛堟瘡鎷嶄竴涓級
        for (let i = 0; i < totalBeats; i++) {
            const melIdx = i % style.melody.length;
            const note = style.melody[melIdx];
            const freq = NOTE_FREQ[note];
            if (!freq) continue;
            const t = ctx.currentTime + i * beatDur;
            const dur = beatDur * 0.8;
            this.playNote(freq, t, dur, 0.15);
        }
    }

    playNote(freq, startTime, duration, volume) {
        const ctx = this.audioCtx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";  // 娓╂殩鐨勬寮︽尝
        osc.frequency.value = freq;

        // ADSR 鍖呯粶
        const attack = 0.05;
        const decay = 0.1;
        const sustain = volume * 0.6;
        const release = 0.3;

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + attack);
        gain.gain.linearRampToValueAtTime(sustain, startTime + attack + decay);
        gain.gain.setValueAtTime(sustain, startTime + duration - release);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration + 0.1);

        this.nodes.push(osc);
    }
}
